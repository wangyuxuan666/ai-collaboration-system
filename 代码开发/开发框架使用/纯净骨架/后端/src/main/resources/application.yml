# 纯净骨架后端配置
server:
  port: 8080

spring:
  application:
    name: skeleton-backend
  # 数据库连接（默认本地 MySQL，库名 skeleton；按实际环境修改）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/skeleton?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:}

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT（生产环境必须更换 secret）
jwt:
  secret: ${JWT_SECRET:change-me-in-local}
  expire-hours: 24
